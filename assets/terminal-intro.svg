  <text x="20" y="318" class="line t10"><tspan class="p">➜ ~</tspan> <tspan class="c type w4">echo $STATUS</tspan></text>
  <text x="20" y="342" class="line t11"><tspan class="c">building agents that survive regulators</tspan> <tspan class="cur">▍</tspan></text>
</svg>
