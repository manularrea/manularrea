  <!-- cmd 1 -->
  <text x="20" y="66" class="line t1"><tspan class="p">➜ ~</tspan> <tspan class="c type w1">whoami</tspan></text>
  <text x="20" y="90" class="line t2"><tspan class="k">Manuela Larrea</tspan><tspan class="o"> · AI Architect &amp; Senior Data Scientist @ BNCR</tspan></text>
  <text x="20" y="112" class="line t3"><tspan class="o">MSc IA &amp; Big Data · Agentic RAG · Gobernanza de IA en banca</tspan></text>

