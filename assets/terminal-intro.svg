  <text x="20" y="280" class="line t9"><tspan class="y">EAFIT/STAI</tspan><tspan class="o">  </tspan><tspan class="y">Microsoft/GenAI-Finanzas</tspan><tspan class="o">  </tspan><tspan class="y">Congreso-Colombiano-Computacion/</tspan></text>

