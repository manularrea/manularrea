<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" font-family="'Fira Code','JetBrains Mono','SF Mono',Menlo,monospace" font-size="15" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .win { fill:#0d1117; stroke:#30363d; stroke-width:1.5; }
      .bar { fill:#161b22; }
      .p   { fill:#7ee787; }
      .c   { fill:#e6edf3; }
      .o   { fill:#8b949e; }
      .k   { fill:#79c0ff; }
      .a   { fill:#d2a8ff; }
      .y   { fill:#ffa657; }
      .cur { fill:#7ee787; animation: blink 1s steps(2,start) infinite; }
      @keyframes blink { to { visibility:hidden; } }
      .line { opacity:0; }
      .t1 { animation: show .01s 0.8s forwards; }
      .t2 { animation: show .01s 2.2s forwards; }
      .t3 { animation: show .01s 3.4s forwards; }
      .t4 { animation: show .01s 4.6s forwards; }
      .t5 { animation: show .01s 6.6s forwards; }
      .t6 { animation: show .01s 7.4s forwards; }
      .t7 { animation: show .01s 8.2s forwards; }
      .t8 { animation: show .01s 9.0s forwards; }
      .t9 { animation: show .01s 10.4s forwards; }
      .t10{ animation: show .01s 11.2s forwards; }
      .t11{ animation: show .01s 12.6s forwards; }
      @keyframes show { to { opacity:1; } }
      .type { clip-path: inset(0 100% 0 0); }
      .w1 { animation: type 1.2s steps(22) 0.8s forwards; }
      .w2 { animation: type 1.8s steps(30) 4.6s forwards; }
      .w3 { animation: type 1.2s steps(20) 9.0s forwards; }
      .w4 { animation: type 1.2s steps(18) 11.2s forwards; }
      @keyframes type { to { clip-path: inset(0 0 0 0); } }
    </style>
  </defs>

  <rect class="win" x="1" y="1" width="758" height="358" rx="10"/>
  <rect class="bar" x="1" y="1" width="758" height="34" rx="10"/>
  <rect class="bar" x="1" y="20" width="758" height="15"/>
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="6" fill="#27c93f"/>
